[tool.poetry]
name = "comment-classifier"
version = "0.1.0"
description = "Tiny Transformer comment classifier (CPU-friendly)"
authors = ["FeresDarouich"]
readme = "README.md"
# This repository is script-oriented (no installable package). Using Poetry for dependency management.
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
aiohappyeyeballs = "2.6.1"
aiohttp = "3.13.2"
aiosignal = "1.4.0"
anyio = "4.12.0"
async-timeout = "5.0.1"
attrs = "25.4.0"
certifi = "2025.11.12"
charset-normalizer = "3.4.4"
click = "8.3.1"
colorama = "0.4.6"
datasets = "4.4.2"
dill = "0.4.0"
exceptiongroup = "1.3.1"
filelock = "3.20.1"
frozenlist = "1.8.0"
fsspec = "2025.10.0"
h11 = "0.16.0"
hf-xet = "1.2.0"
httpcore = "1.0.9"
httpx = "0.28.1"
huggingface-hub = "1.2.3"
idna = "3.11"
jinja2 = "3.1.6"
joblib = "1.5.3"
markupsafe = "3.0.3"
mpmath = "1.3.0"
multidict = "6.7.0"
multiprocess = "0.70.18"
networkx = "3.4.2"
numpy = "2.2.6"
packaging = "25.0"
pandas = "2.3.3"
propcache = "0.4.1"
pyarrow = "22.0.0"
python-dateutil = "2.9.0.post0"
pytz = "2025.2"
pyyaml = "6.0.3"
requests = "2.32.5"
scikit-learn = "1.7.2"
scipy = "1.15.3"
shellingham = "1.5.4"
six = "1.17.0"
sympy = "1.14.0"
threadpoolctl = "3.6.0"
torch = "2.9.1"
tqdm = "4.67.1"
typer-slim = "0.21.0"
typing-extensions = "4.15.0"
tzdata = "2025.3"
urllib3 = "2.6.2"
xxhash = "3.6.0"
yarl = "1.22.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
